[package]
name = "soyel"
version = "0.1.0"
description = "A Tauri application."
authors = ["yunhocho"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77"
default-run = "soyel"

[lib]
name = "soyel_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "soyel"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }

